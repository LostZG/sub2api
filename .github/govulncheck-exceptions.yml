  # 配置且均为可信内网实例，攻击面有限；待上游迁移 jackc/pgx 后移除。
  - id: "GO-2026-6166"
    reason: "GSS 认证无互证；仅可信自建 PG，不启用 GSS 认证"
    mitigation: "连接串由管理员配置，仅指向可信实例；跟随 upstream 迁移 pgx"
    expires_on: "2026-11-19"
