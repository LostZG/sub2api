version: 1
# govulncheck 可达漏洞豁免清单（fork 维护，配合 tools/check_govulncheck_exceptions.py）。
# 规则：每个被 govulncheck 报出的 symbol 级可达漏洞必须在此登记并附过期时间；
# 过期后 CI 失败，强制重新评估（例如上游迁移 pgx 后即可删除）。
exceptions:
  # lib/pq v1.10.9：官方已停止维护（Fixed in N/A），以下漏洞均要求攻击者
